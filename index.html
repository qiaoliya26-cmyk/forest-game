<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>森林小管家</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 禁止滚动，确保内容在一屏内 */
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 垂直居中基准，方便横屏微调 */
            background-image: url("https://i.ibb.co/nsCWBK5c/min.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .game-title {
            font-family: "Comic Sans MS", "Marker Felt", "微软雅黑", sans-serif;
            font-size: 75px;
            color: rgba(0, 0, 0, 0.8);
            margin: 0 20px 60px; /* 底部间距控制标题与按钮的距离 */
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .start-button {
            background-color: #FF9800;
            color: white;
            font-size: 28px;
            padding: 15px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-family: "Comic Sans MS", "微软雅黑", sans-serif;
            margin: 0 20px;
            min-width: 180px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-button:hover, .start-button:active {
            background-color: #FF5722;
            transform: scale(1.05);
        }

        .browser-tip {
            position: fixed;
            bottom: 15px;
            font-size: 14px;
            color: #333;
            text-align: center;
            width: 90%;
            padding: 6px 0;
            background-color: rgba(255,255,255,0.9);
            border-radius: 8px;
            display: none;
            z-index: 10;
        }

        /* 横屏适配核心调整 */
        @media (orientation: landscape) and (max-width: 900px) {
            .game-title {
                font-size: 5vw;
                max-font-size: 48px;
                margin-bottom: 30px; /* 大幅减少标题与按钮的间距 */
                margin-top: -20px; /* 标题上移，间接带动按钮上移 */
            }

            .start-button {
                font-size: 4vw;
                max-font-size: 24px;
                padding: 12px 30px;
                min-width: 150px;
                min-height: 50px;
                /* 关键：通过负margin进一步上移按钮，适应横屏高度限制 */
                margin-top: -10px;
            }

            .browser-tip {
                font-size: 12px;
                bottom: 10px;
            }
        }

        /* 小屏手机横屏（如iPhone SE等） */
        @media (orientation: landscape) and (max-width: 480px) {
            .game-title {
                font-size: 4.5vw;
                margin-bottom: 20px; /* 更小的标题间距 */
                margin-top: -30px; /* 进一步上移标题 */
            }

            .start-button {
                font-size: 3.5vw;
                padding: 10px 25px;
                min-width: 130px;
                margin-top: -20px; /* 按钮更靠上 */
            }
        }
    </style>
</head>
<body>
    <h1 class="game-title">森林小管家</h1>
    <button class="start-button" onclick="goToLevel1()">开始游戏</button>
    <div class="browser-tip" id="browser-tip">
        若未听到语音，请点击页面任意位置触发（浏览器安全策略限制）
    </div>

    <script>
        // 语音播报相关变量
        let preferredVoice = null;
        let isVoiceInitialized = false;
        let isAutoSpoken = false;

        // 初始化语音列表
        function initVoices() {
            const voices = window.speechSynthesis.getVoices();
            const chineseVoices = voices.filter(voice => 
                voice.lang.includes('zh-CN') && 
                (voice.name.includes('Natural') || voice.name.includes('female') || voice.name.includes('女声'))
            );
            if (chineseVoices.length > 0) {
                preferredVoice = chineseVoices[0];
            }
            isVoiceInitialized = true;
            if (!isAutoSpoken) {
                speakWelcomeText();
            }
        }

        window.speechSynthesis.onvoiceschanged = initVoices;
        window.speechSynthesis.getVoices();

        // 播报欢迎文本
        function speakWelcomeText() {
            if (isAutoSpoken) return;
            isAutoSpoken = true;

            const text = "森林小管家，点击开始进入游戏";
            const utterance = new SpeechSynthesisUtterance(text);
            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;

            try {
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                document.getElementById('browser-tip').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('browser-tip').style.display = 'none';
                }, 5000);
            }
        }

        window.onload = function() {
            setTimeout(() => {
                if (isVoiceInitialized) {
                    speakWelcomeText();
                } else {
                    const checkVoice = setInterval(() => {
                        if (isVoiceInitialized) {
                            clearInterval(checkVoice);
                            speakWelcomeText();
                        }
                    }, 100);
                    setTimeout(() => {
                        clearInterval(checkVoice);
                        if (!isAutoSpoken) {
                            document.getElementById('browser-tip').style.display = 'block';
                            setTimeout(() => {
                                document.getElementById('browser-tip').style.display = 'none';
                            }, 5000);
                        }
                    }, 2000);
                }
            }, 300);

            document.body.addEventListener('click', function() {
                if (!isAutoSpoken) {
                    speakWelcomeText();
                }
            }, { once: true });
        }

        function goToLevel1() {
            window.speechSynthesis.cancel();
            window.location.href = "level1.html";
        }
    </script>
</body>
</html>
