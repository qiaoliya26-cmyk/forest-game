<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 关键：添加移动端视口设置，禁止缩放，适配设备宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>森林小管家</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            /* 防止横屏时内容溢出 */
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 垂直居中，适配横屏高度不足问题 */
            background-image: url("https://i.ibb.co/nsCWBK5c/min.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 横屏时背景图防拉伸 */
            background-attachment: fixed;
        }

        .game-title {
            font-family: "Comic Sans MS", "Marker Felt", "微软雅黑", sans-serif;
            font-size: 75px;
            color: rgba(0, 0, 0, 0.8);
            margin: 0 20px 40px; /* 调整边距，避免顶边/底边拥挤 */
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.6);
            text-align: center; /* 横屏时文字过长换行居中 */
        }

        .start-button {
            background-color: #FF9800;
            color: white;
            font-size: 28px;
            padding: 15px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-family: "Comic Sans MS", "微软雅黑", sans-serif;
            margin: 0 20px; /* 左右留边，避免横屏时贴边 */
            /* 移动端触摸优化：增大点击区域（最小48px×48px） */
            min-width: 180px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-button:hover, .start-button:active {
            background-color: #FF5722;
            transform: scale(1.05);
        }

        .browser-tip {
            position: fixed;
            bottom: 15px; /* 横屏时降低底部距离，避免遮挡 */
            font-size: 14px;
            color: #333;
            text-align: center;
            width: 90%; /* 不占满宽度，留边更美观 */
            padding: 6px 0;
            background-color: rgba(255,255,255,0.9);
            border-radius: 8px;
            display: none;
            z-index: 10; /* 确保在最上层，不被遮挡 */
        }

        /* 媒体查询：适配手机横屏（宽度>高度，且屏幕宽度≤900px） */
        @media (orientation: landscape) and (max-width: 900px) {
            .game-title {
                /* 字体大小随屏幕宽度缩放，横屏时更小 */
                font-size: 5vw; 
                max-font-size: 48px; /* 限制最大尺寸，避免过大 */
                margin-bottom: 25px; /* 减少标题与按钮间距，节省垂直空间 */
            }

            .start-button {
                font-size: 4vw;
                max-font-size: 24px;
                padding: 12px 30px;
                min-width: 150px;
                min-height: 50px;
            }

            .browser-tip {
                font-size: 12px;
                bottom: 10px;
                padding: 4px 0;
            }
        }

        /* 额外适配小屏横屏（如手机） */
        @media (orientation: landscape) and (max-width: 480px) {
            .game-title {
                font-size: 4.5vw;
                margin-left: 15px;
                margin-right: 15px;
            }

            .start-button {
                font-size: 3.5vw;
                padding: 10px 25px;
                min-width: 130px;
            }
        }
    </style>
</head>
<body>
    <h1 class="game-title">森林小管家</h1>
    <button class="start-button" onclick="goToLevel1()">开始游戏</button>
    <div class="browser-tip" id="browser-tip">
        若未听到语音，请点击页面任意位置触发（浏览器安全策略限制）
    </div>

    <script>
        // 语音播报相关变量
        let preferredVoice = null;
        let isVoiceInitialized = false;
        let isAutoSpoken = false;

        // 初始化语音列表
        function initVoices() {
            const voices = window.speechSynthesis.getVoices();
            const chineseVoices = voices.filter(voice => 
                voice.lang.includes('zh-CN') && 
                (voice.name.includes('Natural') || voice.name.includes('female') || voice.name.includes('女声'))
            );
            if (chineseVoices.length > 0) {
                preferredVoice = chineseVoices[0];
            }
            isVoiceInitialized = true;
            if (!isAutoSpoken) {
                speakWelcomeText();
            }
        }

        // 监听语音加载事件
        window.speechSynthesis.onvoiceschanged = initVoices;
        window.speechSynthesis.getVoices();

        // 播报欢迎文本
        function speakWelcomeText() {
            if (isAutoSpoken) return;
            isAutoSpoken = true;

            const text = "森林小管家，点击开始进入游戏";
            const utterance = new SpeechSynthesisUtterance(text);
            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;

            try {
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                document.getElementById('browser-tip').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('browser-tip').style.display = 'none';
                }, 5000);
            }
        }

        // 页面加载完成后初始化
        window.onload = function() {
            setTimeout(() => {
                if (isVoiceInitialized) {
                    speakWelcomeText();
                } else {
                    const checkVoice = setInterval(() => {
                        if (isVoiceInitialized) {
                            clearInterval(checkVoice);
                            speakWelcomeText();
                        }
                    }, 100);
                    setTimeout(() => {
                        clearInterval(checkVoice);
                        if (!isAutoSpoken) {
                            document.getElementById('browser-tip').style.display = 'block';
                            setTimeout(() => {
                                document.getElementById('browser-tip').style.display = 'none';
                            }, 5000);
                        }
                    }, 2000);
                }
            }, 300);

            // 点击页面任意位置触发语音（应对浏览器安全限制）
            document.body.addEventListener('click', function() {
                if (!isAutoSpoken) {
                    speakWelcomeText();
                }
            }, { once: true });
        }

        // 跳转函数：点击后进入关卡一页面
        function goToLevel1() {
            window.speechSynthesis.cancel();
            window.location.href = "level1.html";
        }
    </script>
</body>
</html>
